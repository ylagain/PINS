<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PINS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <img
            src="Images/PinsLogV3.1.png"
            alt="PINS Logo"
            class="pins-logo"
        >
    </header>


    <main>

        <!-- App Icon -->

        <img
            src="Images/AppIcon(Rounded).png"
            alt="PINS App Icon"
            class="AppIcon"
        >


        <!-- Description -->

        <p class="game-description">
            <b>
                A Fast-Paced Arcade Game Built Around Dodging,
                Surviving, and Chasing Your Highest Score.
            </b>
        </p>


        <!-- Store Buttons -->

        <div class="image-container2 store-buttons">

            <img
                src="Images/Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.png"
                alt="Download on the App Store"
            >

            <img
                src="Images/GetItOnGooglePlay_Badge_Web_color_English.png"
                alt="Get it on Google Play"
            >

        </div>


        <!-- Gameplay Separator -->

        <img
            src="Images/Seperator.png"
            alt=""
            class="SeperatorSmall"
        >


        <p class="Subtitle">
            <b>FUN GAMEPLAY</b>
        </p>


        <!-- Gameplay Images -->

        <div class="image-container">

            <img
                src="Images/GamePlay2.png"
                alt="Game Play Shot"
            >

            <img
                src="Images/Shop.png"
                alt="Shop Screen Preview"
            >

            <img
                src="Images/Collections.png"
                alt="Collections Screen Preview"
            >

            <img
                src="Images/GamePlay1.png"
                alt="Second Game Play Shot"
            >

            <img
                src="Images/HomeScreen.png"
                alt="Home Screen Preview"
            >

            <img
                src="Images/Inventory.png"
                alt="Inventory Screen Preview"
            >

        </div>


        <!-- Promo Separator -->

        <img
            src="Images/Seperator.png"
            alt=""
            class="SeperatorSmall"
        >

         <p class="Subtitle">
            <b>COLLECT PINS</b>
        </p>
        <p class="game-description">
            <b>Over 50+ PINS To Collect and Earn</b>
        </p>

        <img
            src="Images/PromoImageV2.png"
            alt="PINS Promotional Image"
            class="Promo"
        >

        
        <img
            src="Images/Seperator.png"
            alt=""
            class="SeperatorSmall"
        >

        <!-- Promotional Image -->

        <img
            src="Images/PinsPromotionalImage1.png"
            alt="PINS Promotional Image"
            class="Promo"
        >


        <!-- Footer Separator -->

        <img
            src="Images/Seperator.png"
            alt=""
            class="SeperatorLarge"
        >


        <!-- Navigation -->

        <nav>
            <a href="index.html">Home</a>
            <span>|</span>

            <a href="support.html">Support</a>
            <span>|</span>

            <a href="privacy-policy.html">Privacy Policy</a>
        </nav>

    </main>

</body>

</html>
