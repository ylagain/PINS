<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PINS</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         HEADER / LOGO
    ========================== -->
    <header class="site-header">

        <img
            src="Images/PinsLogoV3.png"
            alt="PINS"
            class="pins-logo"
        >

    </header>


    <main>

        <!-- =========================
             INTRODUCTION
        ========================== -->
        <section class="intro-section">

            <img
                src="Images/Seperator.png"
                alt=""
                class="separator separator-large"
            >

            <img
                src="Images/AppIcon(Rounded).png"
                alt="PINS App Icon"
                class="app-icon"
            >

            <p class="game-description">
                A Fast-Paced Arcade Game Built Around Dodging,
                Surviving, and Chasing Your Highest Score.
            </p>


            <!-- Store Buttons -->
            <div class="store-badges">

                <a href="#" aria-label="Download PINS on the App Store">
                    <img
                        src="Download_on_the_App_Store_Badge_US-UK_RGB_blk_092917.png"
                        alt="Download on the App Store"
                    >
                </a>

                <a href="#" aria-label="Get PINS on Google Play">
                    <img
                        src="GetItOnGooglePlay_Badge_Web_color_English.png"
                        alt="Get it on Google Play"
                    >
                </a>

            </div>

        </section>


        <!-- =========================
             GAMEPLAY
        ========================== -->
        <section class="gameplay-section">

            <img
                src="Images/Seperator.png"
                alt=""
                class="separator separator-small"
            >

            <h2 class="section-title">
                FUN GAMEPLAY
            </h2>


            <div class="screenshot-grid">

                <img
                    src="GamePlay2.png"
                    alt="PINS gameplay screenshot"
                >

                <img
                    src="Shop.png"
                    alt="PINS shop screen"
                >

                <img
                    src="Collections.png"
                    alt="PINS collections screen"
                >

                <img
                    src="GamePlay1.png"
                    alt="PINS gameplay screenshot"
                >

                <img
                    src="HomeScreen.png"
                    alt="PINS home screen"
                >

                <img
                    src="Inventory.png"
                    alt="PINS inventory screen"
                >

            </div>

        </section>


        <!-- =========================
             PROMOTIONAL ART
        ========================== -->
        <section class="promo-section">

            <img
                src="Images/Seperator.png"
                alt=""
                class="separator separator-small"
            >

            <img
                src="Images/PinsPromotionalImage1.png"
                alt="PINS promotional artwork"
                class="promo-image"
            >

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="site-footer">

        <img
            src="Images/Seperator.png"
            alt=""
            class="separator separator-large"
        >

        <nav class="footer-nav">
            <a href="index.html">Home</a>
            <span>|</span>
            <a href="support.html">Support</a>
            <span>|</span>
            <a href="privacy-policy.html">Privacy Policy</a>
        </nav>

    </footer>

</body>

</html>
